name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q MHP3Launcher.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: MHP3Launcher
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MHP3Launcher-apk
          path: MHP3Launcher/app/build/outputs/apk/debug/*.apk
